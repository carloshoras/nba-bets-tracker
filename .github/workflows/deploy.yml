name: Deploy Scraper to AWS Lambda

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write # Requerido para pedir tokens seguros a AWS sin contraseñas
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript to JavaScript
        run: |
          npm run build
          test -f dist/index.js

      - name: Inspect OIDC identity
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString("utf8")
            );

            console.log("issuer:", payload.iss);
            console.log("audience:", payload.aud);
            console.log("subject:", payload.sub);

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::283298108580:role/github-actions-lambda-role
          aws-region: eu-west-1
          audience: sts.amazonaws.com
          retry-max-attempts: 2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Package code into ZIP
        run: |
          npm prune --production
          zip -r deploy.zip dist/ node_modules/ package.json

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name nba-tracker-scraper \
            --zip-file fileb://deploy.zip