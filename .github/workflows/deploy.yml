name: Deploy Scraper to AWS Lambda

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write # Requerido para pedir tokens seguros a AWS sin contraseñas
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript to JavaScript
        run: npx tsc # Compila tus archivos .ts a .js nativos

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # Lee de forma segura tu secreto de GitHub
          aws-region: eu-west-1 # La región de tu Lambda (Irlanda)

      - name: Package code into ZIP
        run: |
          npm prune --production
          zip -r deploy.zip dist/ node_modules/ package.json

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name nba-tracker-scraper \
            --zip-file fileb://deploy.zip